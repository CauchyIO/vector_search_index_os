[project]
name = "worldbank"
version = "0.0.1"
authors = [{ name = "casper@cauchy.io" }]
requires-python = ">=3.10,<=3.13"
dependencies = [
    "wbgapi",
    "pydantic>=2.0",
    "databricks-sdk>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genie", "src/open_data_etl"]

[tool.black]
line-length = 125
