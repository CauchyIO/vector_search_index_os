# This is a Databricks asset bundle definition for worldbank.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: worldbank
  uuid: 5a72f6ab-eb95-4872-bf31-da51338f5213

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-930eaa5c-35a0.cloud.databricks.com
    variables:
      catalog: main_catalog
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-930eaa5c-35a0.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/casper@cauchy.io to make sure we only have a single copy.
      root_path: /Workspace/Users/casper@cauchy.io/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: main_catalog
      schema: prod
    permissions:
      - user_name: casper@cauchy.io
        level: CAN_MANAGE
